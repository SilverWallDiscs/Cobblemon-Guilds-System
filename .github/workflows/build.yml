name: Build and verify (Fabric 1.21.1)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify isolated guild domain invariants
        run: |
          mkdir -p /tmp/guildtests
          javac -d /tmp/guildtests \
            src/main/java/dev/silver/cobbleguilds/Guild.java \
            src/main/java/dev/silver/cobbleguilds/QuestCatalog.java \
            src/test/java/dev/silver/cobbleguilds/GuildDomainSelfTest.java
          java -cp /tmp/guildtests dev.silver.cobbleguilds.GuildDomainSelfTest
      - name: Verify rebalanced leveling and legacy XP conversion
        run: |
          javac -d /tmp/guildtests src/main/java/dev/silver/cobbleguilds/Guild.java src/main/java/dev/silver/cobbleguilds/GuildLevels.java src/test/java/dev/silver/cobbleguilds/GuildLevelsSelfTest.java
          java -cp /tmp/guildtests dev.silver.cobbleguilds.GuildLevelsSelfTest
      - name: Verify buff probability and overflow maths
        run: |
          javac -d /tmp/guildtests src/main/java/dev/silver/cobbleguilds/GuildBuffMath.java src/test/java/dev/silver/cobbleguilds/GuildBuffMathSelfTest.java
          java -cp /tmp/guildtests dev.silver.cobbleguilds.GuildBuffMathSelfTest
      - name: Run build
        run: gradle --no-daemon clean build
      - name: Store build output
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cobblemon-guilds-system-unverified-build
          path: build/libs/*.jar
          if-no-files-found: error
